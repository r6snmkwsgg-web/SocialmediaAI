# Builds Hookline Bridge for Windows, macOS and Linux and attaches the
# downloads to a GitHub release. Push a tag like bridge-v1.0.0 to run it,
# or run it by hand from the Actions tab.
#
# A private repo's release files can't be downloaded by streamers, so the
# release can go to a public repo instead: set the repository variable
# BRIDGE_RELEASE_REPO (owner/name) and the secret BRIDGE_RELEASE_TOKEN (a
# token that can write that repo's contents). Without them it releases here.
#
# The repository variable HOOKLINE_SITE is the site's address
# (https://<site>): only its pages can use the bridge, and the bridge
# asks it whether bridges are switched off. The build stops without it.
name: bridge

on:
  push:
    tags: ["bridge-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon; macos-15-intel is the last Intel Mac runner
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bridge:build
        env:
          HOOKLINE_SITE: ${{ vars.HOOKLINE_SITE }}
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.os }}
          path: |
            dist-bridge/hookline-bridge-*.exe
            dist-bridge/hookline-bridge-*.zip
            dist-bridge/hookline-bridge-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'bridge-latest' }}
          files: out/*
          repository: ${{ vars.BRIDGE_RELEASE_REPO || github.repository }}
          token: ${{ secrets.BRIDGE_RELEASE_TOKEN || github.token }}
