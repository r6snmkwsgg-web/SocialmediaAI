# Builds Hookline Bridge for Windows, macOS and Linux and attaches the
# downloads to a GitHub release. Push a tag like bridge-v1.0.0 to run it,
# or run it by hand from the Actions tab.
name: bridge

on:
  push:
    tags: ["bridge-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-13, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bridge:build
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.os }}
          path: dist-bridge/hookline-bridge-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'bridge-latest' }}
          files: out/*
